<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>SpongeBob Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --accent-yellow: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --accent-green: #10b981;
            --btn-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --btn-blue: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --btn-stars: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent !important; outline: none !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 16px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
        .level-badge { display: inline-block; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: var(--accent-yellow); padding: 6px 16px; border-radius: 20px; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; box-shadow: 0 0 15px var(--accent-glow); }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); gap: 12px; }
        .level-progress-box { display: flex; flex-direction: column; flex: 1; gap: 4px; }
        .level-progress-text { font-size: 11px; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; }
        .level-progress-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
        .level-progress-fill { height: 100%; background: linear-gradient(90deg, #f59e0b 0%, #10b981 100%); width: 0%; transition: width 0.2s ease; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
        .counters-box { display: flex; gap: 8px; font-size: 12px; font-weight: 700; flex-wrap: wrap; justify-content: flex-end; }
        .stat-item { display: flex; align-items: center; gap: 3px; }
        .content-container { flex: 1; position: relative; overflow: hidden; margin: 8px 0; }
        .tab-content { display: none; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; height: 100%; overflow-y: auto; padding: 4px; }
        .tab-content.active { display: flex; }
        
        /* Тапалка */
        .tap-area { position: relative; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: auto; padding: 20px; width: 240px; height: 240px; }
        .spongebob-avatar-container { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #334155 0%, #1e293b 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px var(--accent-glow), inset 0 0 15px rgba(255, 255, 255, 0.1); transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden; border: 4px solid var(--accent-yellow); pointer-events: none; }
        .tap-area:active .spongebob-avatar-container { transform: scale(0.92) rotate(-2deg); }
        .spongebob-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Анимация +1 */
        .floating-num { position: fixed; font-size: 28px; font-weight: 900; color: #4ade80; pointer-events: none; z-index: 9999; text-shadow: 0 0 10px rgba(74, 222, 128, 0.8), 0 2px 4px rgba(0,0,0,0.8); animation: floatAndFade 0.7s ease-out forwards; }
        @keyframes floatAndFade { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.2); } }
        
        .energy-container { width: 100%; margin-top: auto; flex-shrink: 0; background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 14px; }
        .energy-text { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sub); }
        .energy-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 6px; overflow: hidden; }
        .energy-bar-fill { height: 100%; background: linear-gradient(90deg, #10b981 0%, #34d399 100%); width: 100%; transition: width 0.2s ease; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        
        /* Карточки */
        .shop-list { width: 100%; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px; }
        .section-title { margin: 10px 0 4px 0; font-size: 14px; font-weight: 700; color: var(--accent-yellow); text-transform: uppercase; letter-spacing: 0.8px; width: 100%; text-align: left; }
        .upgrade-card, .shop-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 14px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .upgrade-card { flex-direction: column; gap: 10px; align-items: stretch; }
        .upgrade-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .upgrade-title { font-size: 15px; font-weight: 700; }
        .upgrade-desc { font-size: 11px; color: var(--text-sub); }
        .level-tag { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--card-border); padding: 4px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--text-sub); }
        .upgrade-footer { display: flex; justify-content: space-between; align-items: center; }
        .price-text { font-size: 15px; font-weight: 800; color: var(--accent-yellow); display: flex; align-items: center; gap: 4px; }
        
        .btn-upgrade { background: var(--btn-gradient); color: #0f172a; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }
        .btn-blue { background: var(--btn-blue); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn-stars { background: var(--btn-stars); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }

        /* Профиль */
        .profile-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
        .profile-row { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .profile-row:last-child { border-bottom: none; padding-bottom: 0; }
        .profile-label { color: var(--text-sub); }
        .profile-val { font-weight: 700; color: #fff; }
        /* Модалка открытия кейса */
        .case-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 19, 43, 0.95); backdrop-filter: blur(15px); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .case-modal.active { display: flex; }
        .case-box-anim { font-size: 80px; animation: shake 0.5s infinite ease-in-out; }
        @keyframes shake { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-10deg) scale(1.1); } 75% { transform: rotate(10deg) scale(1.1); } }
        .reward-card { background: var(--card-bg); border: 2px solid var(--accent-yellow); border-radius: 20px; padding: 20px 40px; text-align: center; display: none; flex-direction: column; gap: 10px; box-shadow: 0
