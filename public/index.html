<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gift App</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            box-sizing: border-box;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="user-greeting">Привет! 🎁</h1>
        <p id="user-info">Загрузка данных Telegram...</p>
        <button class="btn" onclick="sendData()">Отправить подарок</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что приложение готово к отображению
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('user-greeting').innerText = Привет, ${user.first_name}! 🎁;
            document.getElementById('user-info').innerText = Твой ID: ${user.id};
        } else {
            document.getElementById('user-info').innerText = 'Запущено вне Telegram';
        }

        // Функция отправки данных обратно боту
        function sendData() {
            tg.sendData(JSON.stringify({ action: "gift_sent", time: new Date() }));
            tg.close(); // Закрыть окно
        }
    </script>
</body>
</html>
