<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gift App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            box-sizing: border-box;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            opacity: 0.85;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="greeting">🎁 My Gift App</h1>
        <p id="subtext">Приложение успешно запущено в Telegram и готово к работе!</p>
        <button class="btn" onclick="handleClick()">Отправить подарок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Безопасно пытаемся достать имя пользователя
        try {
            const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
            if (user && user.first_name) {
                document.getElementById('greeting').innerText = Привет, ${user.first_name}! 🎁;
            }
        } catch (e) {
            console.log("User data error:", e);
        }

        function handleClick() {
            try {
                tg.sendData(JSON.stringify({ event: "gift_clicked" }));
                tg.close();
            } catch (e) {
                alert("Подарок отправлен!");
            }
        }
    </script>
</body>
</html>
